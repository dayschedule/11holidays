<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2643A"/>
      <stop offset="0.55" stop-color="#E4572E"/>
      <stop offset="1" stop-color="#A63FCB"/>
    </linearGradient>
    <clipPath id="mark"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>

  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>
  <g fill="#fff" fill-opacity=".07">
    <circle cx="1180" cy="40" r="180"/>
    <circle cx="60" cy="540" r="140"/>
  </g>

  <!-- Logo -->
  <g transform="translate(72 72) scale(1.25)">
    <g clip-path="url(#mark)">
      <rect width="64" height="64" fill="#fff"/>
      <rect width="64" height="17" fill="#E4572E" fill-opacity=".25"/>
    </g>
    <rect x="17" y="5" width="5" height="13" rx="2.5" fill="#E4572E"/>
    <rect x="42" y="5" width="5" height="13" rx="2.5" fill="#E4572E"/>
    <path fill="#E4572E" d="M28 24v29h-7.5V33.6l-5 2.9v-6.9L22 24zM45.5 24v29H38V33.6l-5 2.9v-6.9L39.5 24z"/>
    <path fill="#FFD25A" d="M53 22l1.3 3.2 3.2 1.3-3.2 1.3L53 31l-1.3-3.2-3.2-1.3 3.2-1.3z"/>
  </g>
  <text x="176" y="128" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="#fff" letter-spacing="-1">11holidays</text>

  <!-- Headline -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" fill="#fff">
    <text x="72" y="250" font-size="54" font-weight="800" letter-spacing="-1.5">Public Holidays API</text>
    <text x="72" y="310" font-size="54" font-weight="800" letter-spacing="-1.5">for 230+ countries</text>
    <text x="72" y="368" font-size="22" fill-opacity=".9">Public holidays, bank holidays and observances</text>
    <text x="72" y="398" font-size="22" fill-opacity=".9">as JSON, iCal feeds and an npm package.</text>
  </g>

  <!-- Feature pills -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#fff">
    <rect x="72" y="446" width="118" height="40" rx="20" fill="#fff" fill-opacity=".18"/>
    <text x="131" y="472" text-anchor="middle">REST API</text>
    <rect x="202" y="446" width="104" height="40" rx="20" fill="#fff" fill-opacity=".18"/>
    <text x="254" y="472" text-anchor="middle">OpenAPI</text>
    <rect x="318" y="446" width="134" height="40" rx="20" fill="#fff" fill-opacity=".18"/>
    <text x="385" y="472" text-anchor="middle">iCal feeds</text>
    <rect x="464" y="446" width="122" height="40" rx="20" fill="#fff" fill-opacity=".18"/>
    <text x="525" y="472" text-anchor="middle">llms.txt</text>
  </g>

  <!-- Code card -->
  <g transform="translate(700 96)">
    <rect width="508" height="390" rx="18" fill="#1E1830"/>
    <circle cx="28" cy="28" r="7" fill="#FF5F57"/>
    <circle cx="50" cy="28" r="7" fill="#FEBC2E"/>
    <circle cx="72" cy="28" r="7" fill="#28C840"/>
    <g font-family="'JetBrains Mono', Consolas, Menlo, monospace" font-size="16">
      <text x="28" y="84" fill="#8E86A8">$ curl api.11holidays.com/v1/holidays \</text>
      <text x="66" y="108" fill="#8E86A8">?country=US&amp;year=2026</text>
      <text x="28" y="152" fill="#E8E4F3">[</text>
      <text x="44" y="178" fill="#E8E4F3">{</text>
      <text x="64" y="204"><tspan fill="#FF9B7A">"name"</tspan><tspan fill="#E8E4F3">: </tspan><tspan fill="#FFD25A">"Independence Day"</tspan><tspan fill="#E8E4F3">,</tspan></text>
      <text x="64" y="230"><tspan fill="#FF9B7A">"date"</tspan><tspan fill="#E8E4F3">: </tspan><tspan fill="#FFD25A">"2026-07-04"</tspan><tspan fill="#E8E4F3">,</tspan></text>
      <text x="64" y="256"><tspan fill="#FF9B7A">"type"</tspan><tspan fill="#E8E4F3">: </tspan><tspan fill="#FFD25A">"Federal Holiday"</tspan><tspan fill="#E8E4F3">,</tspan></text>
      <text x="64" y="282"><tspan fill="#FF9B7A">"country"</tspan><tspan fill="#E8E4F3">: </tspan><tspan fill="#FFD25A">"US"</tspan></text>
      <text x="44" y="308" fill="#E8E4F3">},</text>
      <text x="44" y="334" fill="#8E86A8">...</text>
      <text x="28" y="360" fill="#E8E4F3">]</text>
    </g>
  </g>
</svg>
